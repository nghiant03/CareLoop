name: careloop
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: careloop
      POSTGRES_USER: careloop
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database_v1:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careloop -d careloop"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    environment:
      CARELOOP_DATABASE_URL: postgresql://careloop:local-demo-only@db:5432/careloop
    command: ["python", "-m", "careloop.db"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      CARELOOP_DATABASE_URL: postgresql://careloop:local-demo-only@db:5432/careloop
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    build: ./ui
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  database_v1:

[project]
name = "careloop-backend"
version = "0.1.0"
description = "CareLoop backend: FastAPI API, approval gate, versioned graph, RAG chat."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "CareLoop Team" },
]
dependencies = [
  "pydantic>=2.13,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# Repo root on sys.path so `shared.envelope_schema` and `backend.app.*` import.
pythonpath = ["."]
testpaths = ["app/tests"]
addopts = "-q"

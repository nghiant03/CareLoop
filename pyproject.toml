[project]
name = "careloop"
version = "0.1.0"
description = "Clinician-reviewed nutrition workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
data = ["pandas>=2.2,<4", "openpyxl>=3.1,<4"]

[project.scripts]
careloop-data = "careloop.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

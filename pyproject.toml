[project]
name = "careloop"
version = "0.1.0"
description = "Clinician-reviewed nutrition workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pypdf>=6,<7",
  "fonttools>=4.60,<5",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "jsonschema>=4,<5",
  "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
data = ["pandas>=2.2,<4", "openpyxl>=3.1,<4"]
ocr = ["paddleocr[doc-parser]==3.7.0"]
ocr-cpu = ["paddlepaddle==3.3.1"]
ocr-gpu = [
  "paddlepaddle-gpu==3.3.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
  "nvidia-cuda-runtime-cu12==12.9.79; sys_platform == 'linux'",
  "nvidia-cuda-nvrtc-cu12==12.9.86; sys_platform == 'linux'",
  "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'linux'",
  "nvidia-cudnn-cu12==9.27.0.42; sys_platform == 'linux'",
  "nvidia-cusolver-cu12==11.7.5.82; sys_platform == 'linux'",
  "nvidia-cusparse-cu12==12.5.10.65; sys_platform == 'linux'",
  "nvidia-cufft-cu12==11.4.1.4; sys_platform == 'linux'",
  "nvidia-curand-cu12==10.3.10.19; sys_platform == 'linux'",
  "nvidia-nccl-cu12==2.32.3; sys_platform == 'linux'",
]

[tool.uv]
conflicts = [[{extra = "ocr-cpu"}, {extra = "ocr-gpu"}]]

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = {index = "paddle-cu129"}

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

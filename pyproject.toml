[project]
name = "careloop"
version = "0.1.0"
description = "CareLoop: clinician-approved nutrient envelopes to meal plans, logged-meal adherence, and cited nutrition Q&A."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "CareLoop Team" },
]
dependencies = [
  "pydantic>=2.13,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "networkx>=3.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "rank-bm25>=0.2.2",
  "clipspy>=1.0.6",
  "pymoo>=0.6.1,<0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.18",
  "numba>=0.59",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/*.sqlite3", "**/*.sqlite3-*", "**/*.sqlite", "**/*.sqlite-*", "**/*.db", "**/*.db-*", "**/*-wal", "**/*-shm", "**/__pycache__/**", "**/.pytest_cache/**"]

[tool.hatch.build.targets.wheel]
# Preserve installation-relative resource paths without shipping clinical state.
# For wheel smoke/deployment, set CARELOOP_APP_DB to an external writable path
# before importing the app. The default uses the user's state directory;
# bundling resources alone does not establish a supported deployment contract.
only-include = ["backend", "shared", "rules", "data/dishes.json", "data/patients.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["rules", "backend", "evaluation"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is declared through argument-default calls.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
search-path = ["."]
